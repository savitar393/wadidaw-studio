model_name: m4_openl3
description: "M4-OpenL3: Cross-Attention with frozen OpenL3 music embeddings (gain-only)"
batch_size: 8
epochs: 30
patience: 5
lr: 0.001
weight_decay: 0.0001
grad_clip: 1.0
text_backend: subword
predict_pan: false  # pan head/renderer scaffold exists; enable after pan labels are generated
seeds: [42, 123, 2026]
# Use with:
#   python -m scripts.train_models --models m4_openl3 --openl3 --seeds 42 123 2026
