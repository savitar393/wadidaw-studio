model_name: m2
description: >-
  M2 Late Fusion Pretrained: frozen YAMNet (AudioSet) audio encoder +
  frozen multilingual MiniLM text encoder -> concat + MLP -> g* (4).
audio_backend: yamnet
audio_encoder: "YAMNet (TF Hub google/yamnet, frozen)"
audio_input: "16 kHz mono waveform"
audio_embed_dim: 2048             # mean+max pooling of 1024-d frame embeddings
yamnet_pool: mean_max
yamnet_cache: data/cache/yamnet
text_backend: huggingface
text_encoder: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 (frozen)"
text_embed_dim: 384
fusion: "concat + MLP"
batch_size: 16
grad_accum_steps: 4        # effective batch = 64
epochs: 50
patience: 8
lr: 0.001
weight_decay: 0.0001
dropout: 0.15
hidden_dim: 256
grad_clip: 1.0
seeds: [42, 123, 2026]
# NOTE: configs/*.yaml are documentation only. The effective configuration is
# provided on the CLI, e.g.:
#   python -m scripts.train_models --models m2 --yamnet --text-backend huggingface \
#     --batch-size 16 --grad-accum 4 --epochs 50 --patience 8
#
# Alternative frozen audio encoder (kept for comparison):
#   --panns   (PANNs CNN14, 2048-d log-mel embeddings, ~320 MB checkpoint)
